name: Daily Top-10 Volume Report

on:
  schedule:
    # จันทร์-ศุกร์ 17:40 น. เวลาไทย (10:40 UTC) หลังตลาดปิด
    - cron: "40 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_top_volume
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python top_volume.py --source yahoo --ai
          else
            python top_volume.py --source yahoo
          fi
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Top-10 volume report $(date -u +%F)"
          git push
